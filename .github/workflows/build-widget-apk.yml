name: Build TKOR Widget APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TKORWidgetAndroid.zip"
      - ".github/workflows/build-widget-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip TKOR Widget
        run: |
          mkdir -p build-src
          unzip -q TKORWidgetAndroid.zip -d build-src

      - name: Build APK
        working-directory: build-src/TKORWidgetAndroid
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TKORWidget-APK
          path: build-src/TKORWidgetAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
