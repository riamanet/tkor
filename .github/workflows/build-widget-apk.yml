name: Build TKOR Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (example: 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Version code (must increase every release)"
        required: true
        default: "100"
        type: string
      publish_release:
        description: "Publish GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q TKORWidgetAndroid.zip -d build-src

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TKOR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing TKOR_KEYSTORE_BASE64" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tkor-release.jks"

      - name: Build signed APK and AAB
        working-directory: build-src/TKORWidgetAndroid
        env:
          TKOR_KEYSTORE_FILE: ${{ runner.temp }}/tkor-release.jks
          TKOR_KEYSTORE_PASSWORD: ${{ secrets.TKOR_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TKOR_KEYSTORE_PASSWORD" || (echo "Missing TKOR_KEYSTORE_PASSWORD" && exit 1)
          gradle :app:assembleRelease :app:bundleRelease --no-daemon \
            -PversionCode=${{ inputs.version_code }} \
            -PversionName=${{ inputs.version_name }}

      - name: Prepare files
        run: |
          mkdir -p dist
          cp build-src/TKORWidgetAndroid/app/build/outputs/apk/release/app-release.apk "dist/TKOR-Schedule-${{ inputs.version_name }}.apk"
          cp build-src/TKORWidgetAndroid/app/build/outputs/bundle/release/app-release.aab "dist/TKOR-Schedule-${{ inputs.version_name }}.aab"
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload signed build
        uses: actions/upload-artifact@v4
        with:
          name: TKOR-Schedule-${{ inputs.version_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version_name }}"
          gh release create "$TAG" dist/* \
            --title "TKOR 일정 ${{ inputs.version_name }}" \
            --notes "TKOR 일정 위젯 정식 배포본입니다. APK 설치 파일과 AAB 스토어 제출 파일이 포함되어 있습니다."
